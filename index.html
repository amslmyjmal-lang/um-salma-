<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Salma - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--plum-deep:#2b1233;--plum-mid:#4a2150;--rose-dusk:#8c4a62;--gold:#c9a45c;--gold-soft:#e6cf9a;--paper:#fbf7f2;--line:#e4d9cc;--danger:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:"Tajawal",sans-serif;color:var(--plum-deep);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 15% 10%,var(--rose-dusk) 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,var(--plum-mid) 0%,transparent 60%),var(--plum-deep)}
.login-container{width:100%;max-width:420px;padding:32px 28px;background:var(--paper);border-radius:20px;border-top:4px solid var(--gold);box-shadow:0 24px 60px rgba(20,5,28,.45);text-align:center}
h1{font-family:"Amiri",serif;margin:0;font-size:2rem}
.login-container p{margin:6px 0 24px;color:var(--rose-dusk)}
form{display:flex;flex-direction:column;gap:14px}
input{width:100%;padding:14px 16px;font:inherit;border:1.5px solid var(--line);border-radius:12px}
.btn{min-height:46px;padding:12px 22px;font-weight:700;background:linear-gradient(135deg,var(--gold-soft),var(--gold));border:0;border-radius:12px;cursor:pointer}
#error{color:var(--danger);min-height:1.2em}
</style>
</head>
<body>
<div class="login-container">
  <h1>Um Salma Perfumes</h1>
  <p>عالم العطور الفاخرة - ادخل بأي اسم</p>
  <form id="loginForm">
    <input type="text" id="username" placeholder="اسم المستخدم (أي اسم)" required>
    <input type="password" id="password" placeholder="كلمة السر (أي كلمة)" required>
    <button type="submit" class="btn">دخول</button>
    <span id="error"></span>
  </form>
</div>

<script>
// التعديل هنا: لغينا نظام المستخدمين المحفوظ
const form = document.getElementById("loginForm");
const userEl = document.getElementById("username");
const passEl = document.getElementById("password");
const errEl = document.getElementById("error");

function enter(name) {
  sessionStorage.setItem("loggedIn", "true");
  sessionStorage.setItem("userName", name);
  window.location.href = "services.html";
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  const user = userEl.value.trim();
  const pass = passEl.value.trim();
  
  // التعديل الأساسي: فقط يتأكد انه كتب حاجة، ويدخل طوالي
  if (user === "" || pass === "") {
    errEl.textContent = "اكتب الاسم وكلمة السر";
    return;
  }
  
  // يدخل بأي اسم وأي كلمة سر
  enter(user);
});
</script>
</body>
</html>
