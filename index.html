<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Salma - تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-container">
  <h1>Um Salma Perfumes</h1>
  <p>عالم العطور الفاخرة</p>
  <form id="loginForm">
    <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username" required>
    <input type="password" id="password" placeholder="كلمة السر" autocomplete="current-password" required>
    <button type="submit" class="btn">تسجيل الدخول</button>
    <span id="error" role="alert"></span>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var user = document.getElementById("username").value.trim();
  var pass = document.getElementById("password").value.trim();

  // أي اسم وأي كلمة مرور مقبولة، بشرط ما يكونوا فاضيين
  if (user !== "" && pass !== "") {
    sessionStorage.setItem("loggedIn", "true");
    sessionStorage.setItem("userName", user);
    window.location.href = "services.html";
  } else {
    document.getElementById("error").textContent = "اكتب الاسم وكلمة السر";
  }
});
</script>
</body>
</html>
