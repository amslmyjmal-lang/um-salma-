<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Salma - تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login-container">
  <h1>Um Salma Perfumes</h1>
  <p>عالم العطور الفاخرة</p>
  <form id="loginForm">
    <input type="text" id="username" placeholder="اسم المستخدم" required>
    <input type="password" id="password" placeholder="كلمة السر" required>
    <button type="submit">تسجيل الدخول</button>
    <span id="error"></span>
  </form>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  let user = document.getElementById("username").value.trim();
  let pass = document.getElementById("password").value.trim();

  // أي اسم وأي كلمة مرور مقبولة، بشرط ما يكونوا فاضيين
  if(user !== "" && pass !== ""){
    sessionStorage.setItem("loggedIn", "true");
    window.location.href = "services.html";
  } else {
    document.getElementById("error").textContent = "اكتب الاسم وكلمة السر";
  }
});
</script>
</body>
</html>
